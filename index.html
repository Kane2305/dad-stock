<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>股票存摺</title>
<style>
  :root{
    --paper:#F7F3EA;
    --paper-deep:#EFE8D6;
    --line:#DCD3BC;
    --ink:#242F29;
    --ink-soft:#5B6B60;
    --gain:#B3261E;
    --loss:#1E7A54;
    --gold:#B98F3D;
    --card:#FFFFFF;
    --radius:14px;
    --shadow:0 1px 2px rgba(36,47,41,.06), 0 6px 20px rgba(36,47,41,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,var(--paper) 0%,var(--paper-deep) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}
  #app{max-width:720px;margin:0 auto;padding:0 0 100px;}

  header.top{padding:26px 20px 16px;position:relative;}
  header.top::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;
    background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px);}
  h1.title{font-size:25px;font-weight:700;margin:0;letter-spacing:.02em;}
  .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .syncbar{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .dot{width:7px;height:7px;border-radius:50%;background:#C6BC9F;flex:none;}
  .dot.on{background:var(--loss);}
  .dot.off{background:var(--gain);}
  .link{color:var(--gold);font-weight:700;cursor:pointer;text-decoration:underline;}

  .stamp{margin:18px 20px 4px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .stamp .label{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .stamp .value{font-size:29px;font-weight:700;}
  .stamp .foot{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .chop{width:62px;height:62px;border-radius:10px;border:2.5px solid var(--gain);color:var(--gain);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;
    transform:rotate(-8deg);flex:none;line-height:1.15;text-align:center;opacity:.85;
    font-family:"Noto Serif TC","PingFang TC",serif;}
  .chop.neg{border-color:var(--loss);color:var(--loss);}
  .chop.neutral{border-color:var(--gold);color:var(--gold);}
  .metriccard{cursor:pointer;user-select:none;transition:transform .08s ease;}
  .metriccard:active{transform:scale(.985);}
  .cyclehint{font-size:11px;color:var(--ink-soft);margin-top:9px;opacity:.75;
    display:inline-flex;align-items:center;gap:5px;}
  .cyclehint::before{content:"⟳";font-size:12px;}

  .tabs{display:flex;gap:4px;margin:18px 20px 2px;background:var(--paper-deep);border-radius:12px;padding:4px;}
  .tab{flex:1;text-align:center;padding:9px 2px;border-radius:9px;font-size:13px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;user-select:none;}
  .tab.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

  .section{padding:14px 20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:10px;}
  .rb{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .sname{font-weight:700;font-size:15px;}
  .scode{color:var(--ink-soft);font-size:12px;margin-left:6px;}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--paper-deep);color:var(--ink-soft);}
  .gain{color:var(--gain);}
  .loss{color:var(--loss);}

  .txn{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;
    padding:12px 2px;border-bottom:1px dashed var(--line);}
  .txn:last-child{border-bottom:none;}
  .badge{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;flex:none;}
  .badge.b{background:#FBEAE8;color:var(--gain);}
  .badge.s{background:#E7F3ED;color:var(--loss);}
  .del{cursor:pointer;font-size:12px;color:var(--ink-soft);text-decoration:underline;}
  .edit{cursor:pointer;font-size:12px;color:var(--gold);text-decoration:underline;font-weight:600;}
  .rowacts{display:flex;gap:10px;justify-content:flex-end;margin-top:2px;}
  .tnote{font-size:12px;color:var(--ink-soft);margin-top:3px;padding-left:8px;
    border-left:2px solid var(--line);font-style:italic;}

  .empty{text-align:center;padding:52px 20px;color:var(--ink-soft);}
  .empty .g{font-size:34px;margin-bottom:10px;}

  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--ink);color:#fff;}
  .btn-g{background:var(--paper-deep);color:var(--ink);}
  .btn-blk{width:100%;}
  .fab{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;
    justify-content:center;border:none;box-shadow:0 8px 24px rgba(36,47,41,.35);cursor:pointer;z-index:20;}

  .backdrop{position:fixed;inset:0;background:rgba(36,47,41,.45);display:flex;
    align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--paper);width:100%;max-width:720px;border-radius:20px 20px 0 0;
    padding:20px 20px 28px;max-height:88vh;overflow-y:auto;position:relative;}
  @media(min-width:560px){.backdrop{align-items:center;}.modal{border-radius:20px;max-width:480px;}}
  .mtitle{font-size:18px;font-weight:700;margin:0 0 16px;}
  .x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:16px;font-family:inherit;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .seg{display:flex;gap:8px;margin-bottom:16px;}
  .seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .seg button.on.b{background:#FBEAE8;border-color:var(--gain);color:var(--gain);}
  .seg button.on.s{background:#E7F3ED;border-color:var(--loss);color:var(--loss);}
  .acts{display:flex;gap:10px;margin-top:18px;}
  .helper{font-size:12px;color:var(--ink-soft);margin-top:5px;}
  .warn{background:#FBEAE8;color:var(--gain);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 20px 4px;}
  .addlink{font-size:12.5px;color:var(--gold);font-weight:700;cursor:pointer;margin-top:7px;display:inline-block;}
  .newstock{margin-top:10px;display:flex;gap:8px;}
  .newstock input:first-child{flex:1;}
  .newstock input:nth-child(2){width:100px;}

  .minitabs{display:inline-flex;gap:3px;background:var(--paper-deep);border-radius:9px;padding:3px;margin-bottom:12px;}
  .minitab{padding:7px 16px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;user-select:none;}
  .minitab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  .ctitle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .sumtable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  .sumtable th{font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:6px 4px;
    border-bottom:1px solid var(--line);text-align:center;}
  .sumtable td{padding:7px 4px;text-align:center;border-bottom:1px dashed var(--line);}
  .sumtable tr:last-child td{border-bottom:none;}
  .sumtable tr.yearrow td{background:var(--paper-deep);border-bottom:1px solid var(--line);}
  .dlbtn{font-size:11.5px;color:var(--gold);font-weight:700;cursor:pointer;text-decoration:underline;
    white-space:nowrap;flex:none;}
  .ctitle{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;}
  svg{display:block;width:100%;height:auto;}

  .srow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);}
  .help-h{font-weight:700;font-size:14.5px;margin:20px 0 6px;color:var(--ink);}
  .help-h:first-child{margin-top:0;}
  .help-p{font-size:13.5px;line-height:1.8;color:var(--ink-soft);margin:0 0 4px;}
  .help-eg{background:var(--paper-deep);border-radius:10px;padding:10px 12px;font-size:12.5px;
    color:var(--ink);line-height:1.7;margin:8px 0;}
  .srow:last-child{border-bottom:none;}
  .codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--paper-deep);
    padding:9px 11px;border-radius:8px;word-break:break-all;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,.25);}
  select{appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6B60' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =======================================================================
   股票存摺 — 純 JavaScript 版，不依賴任何外部函式庫
   Firebase 只在「雲端同步」時才載入；沒有網路一樣可以正常記帳
   ======================================================================= */

/* ---------- Firebase 設定：從瀏覽器本機讀取，透過「設定」介面貼上，不用改程式碼 ---------- */
var FB_CONFIG_KEY = "dadstock_firebase_config";
function loadFirebaseConfig(){
  try{
    var raw = localStorage.getItem(FB_CONFIG_KEY);
    if(!raw) return null;
    var cfg = JSON.parse(raw);
    if(cfg && cfg.apiKey && cfg.projectId) return cfg;
  }catch(e){}
  return null;
}
var FIREBASE_CONFIG = loadFirebaseConfig();
var FIREBASE_READY = !!FIREBASE_CONFIG;

var FB_REQUIRED_KEYS = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];
function parseFirebaseConfigText(text){
  var out = {}, missing = [];
  FB_REQUIRED_KEYS.forEach(function(k){
    var re = new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']');
    var m = text.match(re);
    if(m) out[k] = m[1]; else missing.push(k);
  });
  return { config: out, missing: missing };
}

/* ---------- 內建標的清單 ---------- */
var SEED_STOCKS = [
  {id:"s_0050",   name:"元大台灣50",       code:"0050"},
  {id:"s_2330",   name:"台積電",           code:"2330"},
  {id:"s_2308",   name:"台達電",           code:"2308"},
  {id:"s_3711",   name:"日月光投控",       code:"3711"},
  {id:"s_6515",   name:"穎崴",             code:"6515"},
  {id:"s_3081",   name:"聯亞",             code:"3081"},
  {id:"s_1560",   name:"中砂",             code:"1560"},
  {id:"s_6223",   name:"旺矽",             code:"6223"},
  {id:"s_2351",   name:"順德",             code:"2351"},
  {id:"s_8150",   name:"南茂",             code:"8150"},
  {id:"s_1721",   name:"三晃",             code:"1721"},
  {id:"s_6727",   name:"亞泰金屬",         code:"6727"},
  {id:"s_6104",   name:"創惟",             code:"6104"},
  {id:"s_00738U", name:"期元大道瓊白銀",   code:"00738U"},
  {id:"s_00984A", name:"主動安聯台灣高息", code:"00984A"}
];

/* ---------- 小工具 ---------- */
function uid(p){ return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(n){ var v=Math.round(n); return (v<0?"-":"")+"$"+Math.abs(v).toLocaleString("zh-TW"); }
function lots(sh){
  var n = Math.round(sh);
  if((STATE.qtyUnit||"share")==="lot"){
    var v = n/1000;
    // 精確到 1 股（0.001 張），並去掉多餘的 0
    var s = v.toFixed(3).replace(/\.?0+$/, "");
    if(s==="" || s==="-") s = "0";
    return s+" 張";
  }
  return n.toLocaleString("zh-TW")+" 股";
}
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pct(n){ return (n>=0?"+":"")+n.toFixed(2)+"%"; }

/* ---------- 交易欄位共用驗證 ---------- */
function validateTxnFields(f){
  // f: {stockId, date, lots, price, cost}
  if(!f.stockId) return "請選擇標的";
  if(!f.date) return "請選擇成交日期";
  if(f.date > today()) return "成交日期不能是未來的日期，請確認年份有沒有打錯";
  var isLotMode = (STATE.qtyUnit||"share")==="lot";
  var qty = parseFloat(f.lots);
  if(!qty || qty<=0 || !isFinite(qty)){
    return isLotMode ? "請填寫正確的張數（要大於 0）" : "請填寫正確的股數（要大於 0）";
  }
  var sharesRaw = isLotMode ? qty*1000 : qty;
  if(Math.abs(sharesRaw - Math.round(sharesRaw)) > 1e-6){
    return isLotMode
      ? "張數最多只能到小數點後三位（0.001 張 = 1 股），沒有半股這種東西"
      : "股數要填整數，沒有半股這種東西";
  }
  var shares = Math.round(sharesRaw);
  if(shares < 1){
    return isLotMode ? "張數太小了，最少要 0.001 張（= 1 股）" : "股數最少要 1 股";
  }
  var price = parseFloat(f.price);
  if(!price || price<=0 || !isFinite(price)) return "請填寫正確的成交單價（要大於 0）";
  if(f.cost!==""){
    var c = parseFloat(f.cost);
    if(isNaN(c) || !isFinite(c)) return "含稅金成本價不是有效的數字";
    if(c<=0) return "含稅金成本價要大於 0，請確認有沒有多打減號";
  }
  return null;
}

/* ---------- 資料狀態 ---------- */
var STATE = {
  stocks: SEED_STOCKS.slice(),
  txns: [],
  tab: "holdings",
  statsFilter: "all",   // "all" 或某個 stockId
  historyMode: "time",  // "time" 依時間 | "stock" 依標的
  historyDateFilter: { type: "all" },   // all | month | range
  historyRangeDraftOpen: false,
  statsDateFilter: { type: "all" },
  statsRangeDraftOpen: false,
  costMethod: "fifo",   // fifo 先進先出 | avg 平均成本
  homeMetric: "realized",
  qtyUnit: "share",   // share 股 | lot 張
  syncCode: "",
  syncStatus: "idle",   // idle | connecting | connected | error
  syncError: null
};

var LOCAL_KEY = "dadstock_data_v2";
var CODE_KEY  = "dadstock_sync_code";
var METHOD_KEY = "dadstock_cost_method";
var METRIC_KEY = "dadstock_home_metric";
var UNIT_KEY = "dadstock_qty_unit";

function loadLocal(){
  try{
    var raw = localStorage.getItem(LOCAL_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d.stocks && d.stocks.length) STATE.stocks = d.stocks;
      if(d.txns) STATE.txns = d.txns;
    }
    STATE.syncCode = localStorage.getItem(CODE_KEY) || "";
    var cm = localStorage.getItem(METHOD_KEY);
    if(cm==="fifo" || cm==="avg") STATE.costMethod = cm;
    var hm = localStorage.getItem(METRIC_KEY);
    if(hm) STATE.homeMetric = hm;
    var qu = localStorage.getItem(UNIT_KEY);
    if(qu==="share" || qu==="lot") STATE.qtyUnit = qu;
  }catch(e){ console.warn("本機資料讀取失敗", e); }
}
function saveLocal(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify({stocks:STATE.stocks, txns:STATE.txns}));
  }catch(e){ console.warn("本機資料儲存失敗", e); }
}

/* ---------- FIFO 損益引擎 ---------- */
function ledgerFor(stockId){
  var list = STATE.txns.filter(function(t){ return t.stockId===stockId; })
    .slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return a.createdAt-b.createdAt;
    });

  var method = STATE.costMethod || "fifo";
  var realized=[], warnings=[];
  var queue=[];            // fifo 用：每批買進
  var avgShares=0, avgCost=0;  // 平均成本用：目前總股數 / 總成本

  for(var i=0;i<list.length;i++){
    var t=list[i];
    var unit = t.costWithTax / t.shares;

    if(t.type==="buy"){
      if(method==="fifo"){
        queue.push({left:t.shares, unit:unit, date:t.date});
      }else{
        avgShares += t.shares;
        avgCost += t.costWithTax;
      }
    }else{
      if(method==="fifo"){
        var remain=t.shares, avail=0;
        for(var q=0;q<queue.length;q++) avail+=queue[q].left;
        if(avail < remain-0.0001){
          warnings.push(t.date+" 賣出 "+lots(t.shares)+"，但可配對的買進不足，請檢查是否漏記買進。");
        }
        while(remain>0.0001 && queue.length>0){
          var lot=queue[0];
          var m=Math.min(remain, lot.left);
          var costBasis = m*lot.unit;
          realized.push({
            sellDate:t.date, buyDate:lot.date, shares:m,
            buyUnit:lot.unit, sellUnit:unit, profit:m*(unit-lot.unit),
            cost: costBasis,
            roi: costBasis>0 ? (m*(unit-lot.unit))/costBasis*100 : 0
          });
          lot.left-=m; remain-=m;
          if(lot.left<=0.0001) queue.shift();
        }
      }else{
        if(avgShares < t.shares-0.0001){
          warnings.push(t.date+" 賣出 "+lots(t.shares)+"，但可配對的買進不足，請檢查是否漏記買進。");
        }
        var sellQty = Math.min(t.shares, avgShares);
        if(sellQty > 0.0001){
          var unitAvg = avgCost/avgShares;
          var cb = sellQty*unitAvg;
          var proceeds = sellQty*unit;
          realized.push({
            sellDate:t.date, buyDate:null, shares:sellQty,
            buyUnit:unitAvg, sellUnit:unit, profit:proceeds-cb,
            cost: cb,
            roi: cb>0 ? (proceeds-cb)/cb*100 : 0
          });
          avgCost -= cb;
          avgShares -= sellQty;
          if(avgShares<=0.0001){ avgShares=0; avgCost=0; }
        }
      }
    }
  }

  var hs=0, hc=0;
  if(method==="fifo"){
    for(var k=0;k<queue.length;k++){ hs+=queue[k].left; hc+=queue[k].left*queue[k].unit; }
  }else{
    hs=avgShares; hc=avgCost;
  }

  var total=0, totalCost=0;
  for(var r=0;r<realized.length;r++){ total+=realized[r].profit; totalCost+=realized[r].cost; }
  return {
    holdingShares:hs, avgCost: hs>0?hc/hs:0, holdingCost:hc,
    realized:realized, totalRealized:total,
    realizedCost: totalCost,
    totalRoi: totalCost>0 ? total/totalCost*100 : 0,
    warnings:warnings
  };
}
function allLedgers(){
  var m={}, seen={};
  for(var i=0;i<STATE.stocks.length;i++){
    seen[STATE.stocks[i].id]=true;
    m[STATE.stocks[i].id]=ledgerFor(STATE.stocks[i].id);
  }
  // 涵蓋「標的已被刪除但交易還在」的孤兒資料，避免首頁總計漏算
  for(var j=0;j<STATE.txns.length;j++){
    var sid=STATE.txns[j].stockId;
    if(!seen[sid]){ seen[sid]=true; m[sid]=ledgerFor(sid); }
  }
  return m;
}

/* ---------- 雲端同步（可選，失敗不影響本機使用） ---------- */
var fbUnsub = null;
var fbReadyLoaded = false;
var pendingSyncConflict = null; // { stocks, txns }

function txnsDiffer(a, b){
  if(a.length !== b.length) return true;
  var idsA = a.map(function(x){ return x.id; }).slice().sort();
  var idsB = b.map(function(x){ return x.id; }).slice().sort();
  for(var i=0;i<idsA.length;i++) if(idsA[i]!==idsB[i]) return true;
  return false;
}
var fbConnectTimeout = null;

function loadFirebaseScripts(cb){
  if(fbReadyLoaded){ cb(true); return; }
  if(!FIREBASE_READY){ cb(false); return; }
  var urls = [
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"
  ];
  var idx = 0;
  function next(){
    if(idx>=urls.length){ fbReadyLoaded = true; cb(true); return; }
    var s=document.createElement("script");
    s.src=urls[idx++];
    s.onload=next;
    s.onerror=function(){ cb(false); };
    document.head.appendChild(s);
  }
  next();
}

function reinitFirebaseApp(){
  if(typeof firebase!=="undefined" && firebase.apps && firebase.apps.length){
    firebase.apps.slice().forEach(function(a){ try{ a.delete(); }catch(e){} });
  }
}

function saveFirebaseConfig(cfg){
  FIREBASE_CONFIG = cfg;
  FIREBASE_READY = true;
  localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
  fbReadyLoaded = false; // 需要用新設定重新初始化
  reinitFirebaseApp();
}
function clearFirebaseConfig(){
  if(fbUnsub){ fbUnsub(); fbUnsub=null; }
  reinitFirebaseApp();
  localStorage.removeItem(FB_CONFIG_KEY);
  localStorage.removeItem(CODE_KEY);
  FIREBASE_CONFIG = null;
  FIREBASE_READY = false;
  fbReadyLoaded = false;
  STATE.syncCode = "";
  STATE.syncStatus = "idle";
}

function startSync(){
  if(!FIREBASE_READY || !STATE.syncCode) return;
  STATE.syncStatus="connecting"; STATE.syncError=null; render();
  var firstSnapshot = true;
  loadFirebaseScripts(function(ok){
    if(!ok || typeof firebase==="undefined"){
      STATE.syncStatus="error";
      STATE.syncError="Firebase 元件下載失敗（通常是網路問題，或網路擋掉了 gstatic.com）";
      render(); return;
    }
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      var db=firebase.firestore();
      var ref=db.collection("dadStockRooms").doc(STATE.syncCode);
      if(fbUnsub) fbUnsub();
      fbUnsub = ref.onSnapshot(function(snap){
        if(snap.exists){
          var d=snap.data();
          var cloudStocks = d.stocks || [];
          var cloudTxns = d.txns || [];

          if(firstSnapshot){
            firstSnapshot = false;
            if(STATE.txns.length>0 && txnsDiffer(STATE.txns, cloudTxns)){
              pendingSyncConflict = { stocks: cloudStocks, txns: cloudTxns };
              STATE.syncStatus = "conflict";
              render();
              showSyncConflictModal(STATE.txns.length, cloudTxns.length);
              return;
            }
          }

          STATE.syncStatus="connected"; STATE.syncError=null;
          if(cloudStocks.length) STATE.stocks=cloudStocks;
          STATE.txns = cloudTxns;
          saveLocal();
          render();
        }else{
          firstSnapshot=false;
          STATE.syncStatus="connected"; STATE.syncError=null;
          ref.set({stocks:STATE.stocks, txns:STATE.txns, updatedAt:Date.now()})
            .catch(function(werr){
              STATE.syncStatus="error";
              STATE.syncError=(werr && werr.code ? "["+werr.code+"] " : "")+(werr && werr.message ? werr.message : String(werr));
              render();
            });
          render();
        }
      }, function(err){
        console.warn("同步錯誤", err);
        STATE.syncStatus="error";
        STATE.syncError=(err && err.code ? "["+err.code+"] " : "")+(err && err.message ? err.message : String(err));
        render();
      });
    }catch(e){
      console.warn(e);
      STATE.syncStatus="error";
      STATE.syncError=(e && e.code ? "["+e.code+"] " : "")+(e && e.message ? e.message : String(e));
      render();
    }
  });
}
function pushCloud(){
  if(!FIREBASE_READY || !STATE.syncCode || typeof firebase==="undefined" || !fbReadyLoaded) return;
  try{
    firebase.firestore().collection("dadStockRooms").doc(STATE.syncCode)
      .set({stocks:STATE.stocks, txns:STATE.txns, updatedAt:Date.now()})
      .then(function(){
        if(STATE.syncStatus==="error"){ STATE.syncStatus="connected"; STATE.syncError=null; render(); }
      })
      .catch(function(e){
        console.warn("寫入失敗", e);
        STATE.syncStatus="error";
        STATE.syncError=(e && e.code ? "["+e.code+"] " : "")+(e && e.message ? e.message : String(e));
        render();
      });
  }catch(e){ console.warn(e); }
}
function commit(){ saveLocal(); pushCloud(); render(); }

  var used={};
  for(var i=0;i<STATE.txns.length;i++) used[STATE.txns[i].stockId]=true;
  var removed = STATE.stocks.filter(function(s){ return !used[s.id]; }).length;
  STATE.stocks = STATE.stocks.filter(function(s){ return used[s.id]; });
  commit();
  return removed;

/* ---------- 從 Excel 貼上匯入 ---------- */
function normalizeDate(raw){
  var s = String(raw).trim().replace(/\//g,"-").replace(/-+/g,"-");
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  var y=m[1], mo=String(m[2]).padStart(2,"0"), da=String(m[3]).padStart(2,"0");
  var d = new Date(y+"-"+mo+"-"+da);
  if(isNaN(d.getTime())) return null;
  if(d.getFullYear()!=y || (d.getMonth()+1)!=Number(mo) || d.getDate()!=Number(da)) return null;
  return y+"-"+mo+"-"+da;
}
function normalizeType(raw){
  var s = String(raw).trim();
  if(/買|buy/i.test(s)) return "buy";
  if(/賣|sell/i.test(s)) return "sell";
  return null;
}
function splitCols(line){
  if(line.indexOf("\t")>-1) return line.split("\t").map(function(x){return x.trim();});
  return line.split(",").map(function(x){return x.trim();});
}

function txnSignature(r){
  // 用「日期+標的名+買賣+股數+單價+含稅成本」判斷是否為同一筆
  return [r.date, r.name, r.type, Math.round(r.shares), Number(r.price).toFixed(4), Math.round(r.costWithTax)].join("|");
}

function parseImportText(text){
  var lines = text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
  var rows=[], errors=[], newStockNames=[], dupExisting=[], dupInFile=[];
  var existingByName = {};
  STATE.stocks.forEach(function(s){ existingByName[s.name]=s; });

  // 建立目前已有交易的簽章索引，用來偵測重複匯入
  var stockNameById = {};
  STATE.stocks.forEach(function(s){ stockNameById[s.id]=s.name; });
  var existingSigs = {}, seenInFile = {};
  STATE.txns.forEach(function(t){
    var nm = stockNameById[t.stockId];
    if(!nm) return;
    existingSigs[txnSignature({date:t.date, name:nm, type:t.type, shares:t.shares, price:t.price, costWithTax:t.costWithTax})] = true;
  });

  for(var i=0;i<lines.length;i++){
    var cols = splitCols(lines[i]);
    if(cols.length<5){
      errors.push("第 "+(i+1)+" 行：欄位數不足（需要至少 5 欄），已略過");
      continue;
    }
    var date = normalizeDate(cols[0]);
    var name = cols[1];
    var type = normalizeType(cols[2]);
    var price = parseFloat(cols[3]);
    var shares = parseFloat(cols[4]);
    var costWithTax = cols.length>=7 ? parseFloat(cols[6]) : (cols.length===6 ? parseFloat(cols[5]) : NaN);

    if(!date){ errors.push("第 "+(i+1)+" 行：日期格式看不懂「"+cols[0]+"」，已略過"); continue; }
    if(date > today()){ errors.push("第 "+(i+1)+" 行：日期「"+date+"」是未來的日期，請確認年份，已略過"); continue; }
    if(!name){ errors.push("第 "+(i+1)+" 行：標的名稱是空的，已略過"); continue; }
    if(!type){ errors.push("第 "+(i+1)+" 行：買賣別看不出來「"+cols[2]+"」，已略過"); continue; }
    if(!price || price<=0){ errors.push("第 "+(i+1)+" 行：價格不是有效數字，已略過"); continue; }
    if(!shares || shares<=0){ errors.push("第 "+(i+1)+" 行：股數不是有效數字，已略過"); continue; }
    if(isNaN(costWithTax) || costWithTax<=0){ costWithTax = price*shares; }

    var sig = txnSignature({date:date, name:name, type:type, price:price, shares:shares, costWithTax:costWithTax});
    if(existingSigs[sig]){
      dupExisting.push("第 "+(i+1)+" 行："+date+" "+name+" "+(type==="buy"?"買":"賣"));
      continue;
    }
    if(seenInFile[sig]){
      dupInFile.push("第 "+(i+1)+" 行："+date+" "+name+" "+(type==="buy"?"買":"賣"));
      continue;
    }
    seenInFile[sig]=true;

    if(!existingByName[name] && newStockNames.indexOf(name)===-1){
      newStockNames.push(name);
    }
    rows.push({date:date, name:name, type:type, price:price, shares:shares, costWithTax:costWithTax});
  }
  return { rows:rows, errors:errors, newStockNames:newStockNames, dupExisting:dupExisting, dupInFile:dupInFile };
}

function commitImport(rows, newStockNames){
  var byName={};
  STATE.stocks.forEach(function(s){ byName[s.name]=s; });
  newStockNames.forEach(function(n){
    if(!byName[n]){
      var s={id:uid("s"), name:n, code:""};
      STATE.stocks.push(s);
      byName[n]=s;
    }
  });
  rows.forEach(function(r, idx){
    STATE.txns.push({
      id: uid("t"), stockId: byName[r.name].id, type:r.type,
      date:r.date, shares:r.shares, price:r.price, costWithTax:r.costWithTax,
      createdAt: Date.now()+idx
    });
  });
  commit();
}
function lineChartSVG(points){
  if(points.length===0) return "";
  var W=640,H=220,PL=64,PR=16,PT=16,PB=32;
  var iw=W-PL-PR, ih=H-PT-PB;
  var vals=points.map(function(p){return p.y;});
  var mn=Math.min.apply(null,vals.concat([0])), mx=Math.max.apply(null,vals.concat([0]));
  if(mn===mx){ mx=mn+1; }
  var pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  function X(i){ return PL + (points.length===1 ? iw/2 : iw*i/(points.length-1)); }
  function Y(v){ return PT + ih*(1-(v-mn)/(mx-mn)); }

  var d="", area="";
  for(var i=0;i<points.length;i++){
    d += (i===0?"M":"L")+X(i).toFixed(1)+" "+Y(points[i].y).toFixed(1)+" ";
  }
  area = d + "L"+X(points.length-1).toFixed(1)+" "+Y(mn).toFixed(1)+" L"+X(0).toFixed(1)+" "+Y(mn).toFixed(1)+" Z";

  // Y 軸格線
  var grid="";
  for(var g=0; g<=4; g++){
    var v = mn + (mx-mn)*g/4;
    var y = Y(v);
    grid += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#DCD3BC" stroke-width="1" stroke-dasharray="3 4"/>';
    grid += '<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#5B6B60">'+money(v)+'</text>';
  }
  // 零軸
  var zero = (0>=mn && 0<=mx) ? '<line x1="'+PL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(0).toFixed(1)+'" stroke="#5B6B60" stroke-width="1.2"/>' : "";

  // X 軸標籤（首、中、末）
  var xl="";
  var idxs = points.length<=2 ? [0,points.length-1] : [0, Math.floor((points.length-1)/2), points.length-1];
  for(var j=0;j<idxs.length;j++){
    var ii=idxs[j];
    xl += '<text x="'+X(ii).toFixed(1)+'" y="'+(H-10)+'" text-anchor="'+(j===0?"start":j===idxs.length-1?"end":"middle")+'" font-size="11" fill="#5B6B60">'+esc(points[ii].label)+'</text>';
  }

  var dots="";
  for(var k=0;k<points.length;k++){
    dots += '<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(points[k].y).toFixed(1)+'" r="3" fill="#B98F3D"/>';
  }

  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="累積已實現損益走勢">'
    + grid + zero
    + '<path d="'+area+'" fill="rgba(185,143,61,.14)"/>'
    + '<path d="'+d+'" fill="none" stroke="#B98F3D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + xl + '</svg>';
}

/* ---------- SVG 橫條圖 ---------- */
function barChartSVG(items){
  if(items.length===0) return "";
  var rowH=34, W=640, PL=104, PR=90, PT=8;
  var H = PT*2 + items.length*rowH;
  var iw = W-PL-PR;
  var maxAbs = 0;
  for(var i=0;i<items.length;i++) maxAbs=Math.max(maxAbs, Math.abs(items[i].value));
  if(maxAbs===0) maxAbs=1;

  var out='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="各標的已實現損益">';
  for(var j=0;j<items.length;j++){
    var it=items[j];
    var y = PT + j*rowH;
    var w = iw * (Math.abs(it.value)/maxAbs);
    var color = it.value>=0 ? "#B3261E" : "#1E7A54";
    out += '<text x="'+(PL-10)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" font-size="12.5" fill="#242F29" font-weight="600">'+esc(it.name)+'</text>';
    out += '<rect x="'+PL+'" y="'+(y+7)+'" width="'+w.toFixed(1)+'" height="'+(rowH-16)+'" rx="4" fill="'+color+'" opacity=".85"/>';
    out += '<text x="'+(PL+w+8).toFixed(1)+'" y="'+(y+rowH/2+4)+'" font-size="12" fill="'+color+'" font-weight="700">'+money(it.value)+'</text>';
  }
  out += '</svg>';
  return out;
}

/* ---------- 年度 / 月度損益總結表 ---------- */
function periodSummaryHTML(realizedList){
  if(realizedList.length===0) return "";

  var byYear = {};
  for(var i=0;i<realizedList.length;i++){
    var r = realizedList[i];
    var y = r.sellDate.slice(0,4);
    var m = r.sellDate.slice(0,7);
    if(!byYear[y]) byYear[y] = { profit:0, cost:0, count:0, months:{} };
    byYear[y].profit += r.profit;
    byYear[y].cost += r.cost;
    byYear[y].count++;
    if(!byYear[y].months[m]) byYear[y].months[m] = { profit:0, cost:0, count:0 };
    byYear[y].months[m].profit += r.profit;
    byYear[y].months[m].cost += r.cost;
    byYear[y].months[m].count++;
  }

  var years = Object.keys(byYear).sort().reverse();
  var out = '<div class="chartbox"><div class="ctitle">年度・月度損益總結</div>'
    + '<table class="sumtable"><thead><tr>'
    + '<th style="text-align:left">期間</th><th>筆數</th><th style="text-align:right">損益</th><th style="text-align:right">報酬率</th>'
    + '</tr></thead><tbody>';

  for(var yi=0; yi<years.length; yi++){
    var y = years[yi], yd = byYear[y];
    var yRoi = yd.cost>0 ? yd.profit/yd.cost*100 : 0;
    out += '<tr class="yearrow">'
      + '<td style="text-align:left"><b>'+y+' 年</b></td>'
      + '<td>'+yd.count+'</td>'
      + '<td style="text-align:right" class="'+(yd.profit>=0?"gain":"loss")+'"><b>'+money(yd.profit)+'</b></td>'
      + '<td style="text-align:right" class="'+(yd.profit>=0?"gain":"loss")+'"><b>'+pct(yRoi)+'</b></td>'
      + '</tr>';

    var months = Object.keys(yd.months).sort().reverse();
    for(var mi=0; mi<months.length; mi++){
      var m = months[mi], md = yd.months[m];
      var mRoi = md.cost>0 ? md.profit/md.cost*100 : 0;
      out += '<tr>'
        + '<td style="text-align:left;padding-left:16px" class="muted">'+m.slice(5)+' 月</td>'
        + '<td class="muted">'+md.count+'</td>'
        + '<td style="text-align:right" class="'+(md.profit>=0?"gain":"loss")+'">'+money(md.profit)+'</td>'
        + '<td style="text-align:right" class="'+(md.profit>=0?"gain":"loss")+'">'+pct(mRoi)+'</td>'
        + '</tr>';
    }
  }
  out += '</tbody></table>'
    + '<div class="muted" style="margin-top:10px;font-size:11.5px">損益歸屬到「賣出」那個月份。報酬率 = 該期間損益 ÷ 該期間賣掉部位的投入成本。</div>'
    + '</div>';
  return out;
}

/* ---------- SVG 每筆損益直條圖（縱向，X 軸為賣出日期） ---------- */
function tradeBarSVG(trades){
  if(trades.length===0) return "";
  var W=640,H=220,PL=64,PR=16,PT=16,PB=42;
  var iw=W-PL-PR, ih=H-PT-PB;
  var vals=trades.map(function(t){return t.profit;});
  var mn=Math.min.apply(null,vals.concat([0])), mx=Math.max.apply(null,vals.concat([0]));
  if(mn===mx) mx=mn+1;
  var pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  function Y(v){ return PT + ih*(1-(v-mn)/(mx-mn)); }

  var n=trades.length;
  var slot = iw/n;
  var bw = Math.min(46, Math.max(6, slot*0.6));

  var grid="";
  for(var g=0; g<=4; g++){
    var v = mn + (mx-mn)*g/4;
    var y = Y(v);
    grid += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#DCD3BC" stroke-width="1" stroke-dasharray="3 4"/>';
    grid += '<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#5B6B60">'+money(v)+'</text>';
  }
  var zeroY = Y(0);
  var zero = '<line x1="'+PL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+zeroY.toFixed(1)+'" stroke="#5B6B60" stroke-width="1.2"/>';

  var bars="";
  for(var i=0;i<n;i++){
    var t=trades[i];
    var cx = PL + slot*i + slot/2;
    var y1 = Y(t.profit);
    var top = Math.min(y1, zeroY);
    var h = Math.abs(y1 - zeroY);
    if(h < 1.5) h = 1.5;
    var color = t.profit>=0 ? "#B3261E" : "#1E7A54";
    bars += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+color+'" opacity=".85"><title>'+esc(t.sellDate)+'　'+money(t.profit)+'</title></rect>';
    // 少於 10 筆時顯示金額標籤
    if(n<=10){
      var ly = t.profit>=0 ? top-5 : top+h+13;
      bars += '<text x="'+cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="'+color+'">'+money(t.profit)+'</text>';
    }
  }

  var xl="";
  var step = n<=6 ? 1 : Math.ceil(n/6);
  for(var j=0;j<n;j+=step){
    var x = PL + slot*j + slot/2;
    xl += '<text x="'+x.toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="10.5" fill="#5B6B60">'+esc(trades[j].sellDate.slice(5))+'</text>';
  }

  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="每筆進出損益">'
    + grid + zero + bars + xl + '</svg>';
}

/* ---------- 圖表下載為 PNG ---------- */
function downloadChartPNG(containerId, filename){
  var container = document.getElementById(containerId);
  var svg = container ? container.querySelector("svg") : null;
  if(!svg){ toast("找不到這張圖表"); return; }
  var w = parseInt(svg.getAttribute("width"),10) || 640;
  var h = parseInt(svg.getAttribute("height"),10) || 220;
  var xml = new XMLSerializer().serializeToString(svg);
  var svg64 = btoa(unescape(encodeURIComponent(xml)));
  var img = new Image();
  img.onload = function(){
    var scale = 2;
    var canvas = document.createElement("canvas");
    canvas.width = w*scale; canvas.height = h*scale;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scale,scale);
    ctx.drawImage(img,0,0,w,h);
    canvas.toBlob(function(blob){
      if(!blob){ toast("圖片產生失敗"); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast("圖片已下載");
    });
  };
  img.onerror = function(){ toast("圖片產生失敗"); };
  img.src = "data:image/svg+xml;base64,"+svg64;
}

/* =======================================================================
   首頁指標（可切換）
   ======================================================================= */
function computeHomeMetrics(L){
  var totalRealized=0, realizedCount=0, realizedCost=0, holdingCostTotal=0;
  var wins=0, losses=0, holdingStocks=0;
  var allRealized=[];
  for(var id in L){
    totalRealized += L[id].totalRealized;
    realizedCount += L[id].realized.length;
    realizedCost += L[id].realizedCost;
    holdingCostTotal += L[id].holdingCost;
    if(L[id].holdingShares>0.001) holdingStocks++;
    for(var i=0;i<L[id].realized.length;i++){
      var r=L[id].realized[i];
      allRealized.push(r);
      if(r.profit>=0) wins++; else losses++;
    }
  }

  var td = today();
  var curYear = td.slice(0,4), curMonth = td.slice(0,7);
  var yearProfit=0, yearCost=0, yearCount=0;
  var monthProfit=0, monthCost=0, monthCount=0;
  for(var j=0;j<allRealized.length;j++){
    var rr=allRealized[j];
    if(rr.sellDate.slice(0,4)===curYear){ yearProfit+=rr.profit; yearCost+=rr.cost; yearCount++; }
    if(rr.sellDate.slice(0,7)===curMonth){ monthProfit+=rr.profit; monthCost+=rr.cost; monthCount++; }
  }

  var totalBought=0, buyCount=0;
  for(var k=0;k<STATE.txns.length;k++){
    if(STATE.txns[k].type==="buy"){ totalBought += STATE.txns[k].costWithTax; buyCount++; }
  }

  var totalRoi = realizedCost>0 ? totalRealized/realizedCost*100 : 0;
  var winRate = realizedCount>0 ? wins/realizedCount*100 : 0;

  return [
    { key:"realized", name:"累積已實現損益",
      value: money(totalRealized), signed:true, positive: totalRealized>=0,
      sub: "共 "+realizedCount+" 筆已出場交易" + (realizedCost>0 ? "　投入成本 "+money(realizedCost) : ""),
      chop: totalRealized>=0 ? "獲利<br>已實現" : "虧損<br>已實現" },

    { key:"realizedRoi", name:"累積已實現報酬率",
      value: realizedCost>0 ? pct(totalRoi) : "—", signed:true, positive: totalRealized>=0,
      sub: realizedCost>0 ? "已實現 "+money(totalRealized)+"　投入成本 "+money(realizedCost) : "還沒有已實現的交易",
      chop: "報酬率" },

    { key:"holdingCost", name:"目前持有中的投入成本",
      value: money(holdingCostTotal), signed:false, positive:true,
      sub: holdingStocks>0 ? "手上有 "+holdingStocks+" 檔，損益尚未實現" : "目前沒有持有中的標的",
      chop: "持有中" },

    { key:"yearRealized", name:curYear+" 年已實現損益",
      value: money(yearProfit), signed:true, positive: yearProfit>=0,
      sub: yearCount+" 筆出場" + (yearCost>0 ? "　報酬率 "+pct(yearProfit/yearCost*100) : ""),
      chop: curYear+"<br>年度" },

    { key:"monthRealized", name:curYear+"年"+parseInt(curMonth.slice(5),10)+"月已實現損益",
      value: money(monthProfit), signed:true, positive: monthProfit>=0,
      sub: monthCount>0 ? monthCount+" 筆出場"+(monthCost>0?"　報酬率 "+pct(monthProfit/monthCost*100):"") : "這個月還沒有出場的交易",
      chop: "本月" },

    { key:"totalBought", name:"歷史累計買進總額",
      value: money(totalBought), signed:false, positive:true,
      sub: "共 "+buyCount+" 筆買進（含已賣出的部分）",
      chop: "累計<br>投入" },

    { key:"winRate", name:"交易勝率",
      value: realizedCount>0 ? winRate.toFixed(0)+"%" : "—", signed:false, positive:true,
      sub: realizedCount>0 ? realizedCount+" 次出場・賺 "+wins+" 次・賠 "+losses+" 次" : "還沒有已實現的交易",
      chop: "勝率" }
  ];
}

/* =======================================================================
   畫面繪製
   ======================================================================= */
function render(){
  var L = allLedgers();
  var warns=[];
  for(var id in L){
    warns = warns.concat(L[id].warnings);
  }

  var html = "";

  /* header */
  var syncTxt;
  if(!FIREBASE_READY){
    syncTxt = '本機模式（尚未設定雲端同步）';
  }else if(!STATE.syncCode){
    syncTxt = '<span class="link" data-act="opensettings">尚未連線 — 點此設定同步</span>';
  }else if(STATE.syncStatus==="connected"){
    syncTxt = '雲端同步中';
  }else if(STATE.syncStatus==="error"){
    syncTxt = '同步失敗，資料仍保存在這台裝置 <span class="link" data-act="opensettings">查看原因</span>';
  }else if(STATE.syncStatus==="conflict"){
    syncTxt = '⚠ 本機和雲端資料不同，需要你決定 <span class="link" data-act="reopenconflict">處理</span>';
  }else{
    syncTxt = '連線中…';
  }
  var dotCls = STATE.syncStatus==="connected"?"on":(STATE.syncStatus==="error"||STATE.syncStatus==="conflict")?"off":"";

  html += '<header class="top">'
    + '<h1 class="title">📒 股票存摺</h1>'
    + '<div class="sub">交易紀錄與已實現損益</div>'
    + '<div class="syncbar"><span class="dot '+dotCls+'"></span><span>'+syncTxt+'</span></div>'
    + '</header>';

  /* 總計卡（可切換指標） */
  var metrics = computeHomeMetrics(L);
  var mIdx = 0;
  for(var mi=0; mi<metrics.length; mi++){ if(metrics[mi].key===STATE.homeMetric) mIdx = mi; }
  var M = metrics[mIdx];
  var valCls = M.signed ? (M.positive?"gain":"loss") : "";
  var chopCls = M.signed ? (M.positive?"":"neg") : "neutral";

  html += '<div class="stamp metriccard" data-act="cyclemetric" role="button" tabindex="0">'
    + '<div style="flex:1;min-width:0">'
    + '<div class="label">'+esc(M.name)+'</div>'
    + '<div class="value num '+valCls+'">'+M.value+'</div>'
    + '<div class="foot">'+M.sub+'</div>'
    + '<div class="cyclehint">輕觸切換　'+(mIdx+1)+' / '+metrics.length+'</div>'
    + '</div>'
    + '<div class="chop '+chopCls+'">'+M.chop+'</div></div>';

  if(warns.length>0){
    html += '<div class="warn">⚠ 有 '+warns.length+' 筆資料配對異常，請到「歷史紀錄」確認是否漏記買進。</div>';
  }

  /* tabs */
  var tabs=[["holdings","持有中"],["history","歷史紀錄"],["stats","統計圖表"],["settings","設定"]];
  html += '<div class="tabs">';
  for(var i=0;i<tabs.length;i++){
    var active = (tabs[i][0]==="settings") ? false : STATE.tab===tabs[i][0];
    html += '<div class="tab '+(active?"active":"")+'" data-tab="'+tabs[i][0]+'">'+tabs[i][1]+'</div>';
  }
  html += '</div>';

  /* content */
  if(STATE.tab==="holdings")      html += viewHoldings(L);
  else if(STATE.tab==="history")  html += viewHistory();
  else if(STATE.tab==="stats")    html += viewStats(L);

  html += '<button class="fab" data-act="add" aria-label="新增交易">＋</button>';

  document.getElementById("app").innerHTML = html;
}

function viewHoldings(L){
  var held=[];
  for(var i=0;i<STATE.stocks.length;i++){
    var s=STATE.stocks[i], l=L[s.id];
    if(!l || l.holdingShares<=0.001) continue;
    held.push({stock:s, ledger:l});
  }
  // 依投入金額由大到小排，重壓的部位排前面
  held.sort(function(a,b){ return b.ledger.holdingCost - a.ledger.holdingCost; });

  var rows="";
  for(var j=0;j<held.length;j++){
    var s2=held[j].stock, l2=held[j].ledger;
    rows += '<div class="card">'
      + '<div class="rb"><div><span class="sname">'+esc(s2.name)+'</span><span class="scode">'+esc(s2.code)+'</span></div>'
      + '<span class="pill">'+lots(l2.holdingShares)+'</span></div>'
      + '<div class="rb" style="margin-top:10px"><span class="muted">平均成本（含稅金）</span>'
      + '<span class="num" style="font-weight:700">'+money(l2.avgCost)+' / 股</span></div>'
      + '<div class="rb" style="margin-top:6px"><span class="muted">投入成本小計</span>'
      + '<span class="num" style="font-weight:700">'+money(l2.holdingCost)+'</span></div>'
      + '</div>';
  }
  if(!rows){
    return '<div class="section"><div class="empty"><div class="g">🗂️</div>'
      + '<div>目前沒有持有中的標的</div>'
      + '<div class="muted" style="margin-top:6px">按右下角「＋」新增一筆買進紀錄</div></div></div>';
  }
  return '<div class="section">'+rows+'</div>';
}

/* ---------- 日期區間篩選 ---------- */
function monthsFromTxns(){
  var set={};
  for(var i=0;i<STATE.txns.length;i++) set[STATE.txns[i].date.slice(0,7)]=true;
  return Object.keys(set).sort().reverse();
}
function monthLabel(m){
  var p=m.split("-");
  return p[0]+"年"+p[1]+"月";
}
function inDateRange(dateStr, filter){
  if(!filter || filter.type==="all") return true;
  if(filter.type==="month") return dateStr.slice(0,7)===filter.month;
  if(filter.type==="range") return dateStr>=filter.start && dateStr<=filter.end;
  return true;
}
function dateFilterBarHTML(prefix, filter, draftOpen){
  var months = monthsFromTxns();
  var opts = '<option value="all"'+(filter.type==="all"?" selected":"")+'>全部區間</option>';
  for(var i=0;i<months.length;i++){
    var m=months[i];
    var sel = (filter.type==="month" && filter.month===m) ? " selected" : "";
    opts += '<option value="'+m+'"'+sel+'>'+monthLabel(m)+'</option>';
  }
  var customActive = filter.type==="range" || draftOpen;
  opts += '<option value="custom"'+(customActive?" selected":"")+'>自訂區間…</option>';

  var html = '<div class="field" style="margin-bottom:10px"><label>篩選區間</label>'
    + '<select id="'+prefix+'RangeSelect" data-scope="'+prefix+'">'+opts+'</select></div>';

  if(customActive){
    var s = filter.type==="range" ? filter.start : "";
    var e = filter.type==="range" ? filter.end : "";
    html += '<div style="display:flex;gap:8px;align-items:flex-end;margin:-2px 0 10px">'
      + '<div class="field" style="margin-bottom:0;flex:1"><label>起</label><input type="date" id="'+prefix+'RangeStart" value="'+s+'"></div>'
      + '<div class="field" style="margin-bottom:0;flex:1"><label>迄</label><input type="date" id="'+prefix+'RangeEnd" value="'+e+'"></div>'
      + '<button class="btn btn-g" style="padding:11px 14px" data-act="applyrange" data-scope="'+prefix+'">套用</button>'
      + '</div>';
  }
  if(filter.type!=="all"){
    var summary = filter.type==="month" ? monthLabel(filter.month) : filter.start+" ～ "+filter.end;
    html += '<div class="muted" style="margin:-2px 0 12px">目前篩選：'+esc(summary)+' '
      + '<span class="addlink" data-act="clearrange" data-scope="'+prefix+'">清除篩選</span></div>';
  }
  return html;
}

function txnRowHTML(t, stockName, showName){
  return '<div class="txn">'
    + '<div class="badge '+(t.type==="buy"?"b":"s")+'">'+(t.type==="buy"?"買":"賣")+'</div>'
    + '<div>'
    + (showName ? '<div style="font-weight:700;font-size:14px">'+esc(stockName)+'</div>' : '')
    + '<div class="muted">'+esc(t.date)+' ・ '+lots(t.shares)+' ・ 單價 '+t.price+'</div>'
    + (t.note ? '<div class="tnote">'+esc(t.note)+'</div>' : '')
    + '</div>'
    + '<div style="text-align:right"><div class="num" style="font-weight:700">'+money(t.costWithTax)+'</div>'
    + '<div class="rowacts"><span class="edit" data-edit="'+t.id+'">編輯</span>'
    + '<span class="del" data-del="'+t.id+'">刪除</span></div></div>'
    + '</div>';
}

function viewHistory(){
  if(STATE.txns.length===0){
    return '<div class="section"><div class="empty"><div class="g">📭</div><div>還沒有任何交易紀錄</div></div></div>';
  }
  var map={};
  for(var i=0;i<STATE.stocks.length;i++) map[STATE.stocks[i].id]=STATE.stocks[i];

  var filterBar = dateFilterBarHTML("history", STATE.historyDateFilter, STATE.historyRangeDraftOpen);
  var filteredTxns = STATE.txns.filter(function(t){ return inDateRange(t.date, STATE.historyDateFilter); });

  var toggle = '<div class="minitabs">'
    + '<div class="minitab '+(STATE.historyMode==="time"?"on":"")+'" data-hmode="time">依時間</div>'
    + '<div class="minitab '+(STATE.historyMode==="stock"?"on":"")+'" data-hmode="stock">依標的</div>'
    + '</div>';

  if(filteredTxns.length===0){
    return '<div class="section">'+filterBar
      + '<div class="empty"><div class="g">📭</div><div>這段期間沒有交易紀錄</div></div></div>';
  }

  var body="";

  if(STATE.historyMode==="time"){
    var sorted = filteredTxns.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return b.createdAt-a.createdAt;
    });
    var rows="";
    for(var j=0;j<sorted.length;j++){
      var t=sorted[j], s=map[t.stockId];
      rows += txnRowHTML(t, s?s.name:"（標的已刪除）", true);
    }
    body = '<div class="card" style="padding:4px 12px">'+rows+'</div>';
  }else{
    var L = allLedgers();
    // 依標的分組，有交易的才顯示，依最近一次交易日期排序
    var groups=[];
    for(var k=0;k<STATE.stocks.length;k++){
      var st=STATE.stocks[k];
      var list = filteredTxns.filter(function(x){ return x.stockId===st.id; })
        .sort(function(a,b){
          if(a.date!==b.date) return a.date<b.date?1:-1;
          return b.createdAt-a.createdAt;
        });
      if(list.length===0) continue;
      groups.push({stock:st, list:list, latest:list[0].date, ledger:L[st.id]});
    }
    // 已刪除標的的孤兒交易
    var known={};
    for(var m=0;m<STATE.stocks.length;m++) known[STATE.stocks[m].id]=true;
    var orphans = filteredTxns.filter(function(x){ return !known[x.stockId]; });
    if(orphans.length>0){
      orphans.sort(function(a,b){ return a.date<b.date?1:-1; });
      groups.push({stock:{id:"__orphan", name:"（標的已刪除）", code:""}, list:orphans, latest:orphans[0].date, ledger:null});
    }

    groups.sort(function(a,b){ return a.latest<b.latest?1:a.latest>b.latest?-1:0; });

    for(var g=0;g<groups.length;g++){
      var grp=groups[g];
      var lg=grp.ledger;
      var meta="";
      if(lg){
        var bits=[];
        if(lg.holdingShares>0.001) bits.push('持有 '+lots(lg.holdingShares));
        if(lg.realized.length>0){
          bits.push('<span class="'+(lg.totalRealized>=0?"gain":"loss")+'" style="font-weight:700">已實現 '
            + money(lg.totalRealized)+' '+pct(lg.totalRoi)+'（全部區間）</span>');
        }
        if(bits.length===0) bits.push('—');
        meta = bits.join(' ・ ');
      }
      var grows="";
      for(var q=0;q<grp.list.length;q++){
        grows += txnRowHTML(grp.list[q], grp.stock.name, false);
      }
      body += '<div class="card" style="padding:14px 12px 4px">'
        + '<div class="rb" style="padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:2px">'
        + '<div><span class="sname">'+esc(grp.stock.name)+'</span>'
        + (grp.stock.code ? '<span class="scode">'+esc(grp.stock.code)+'</span>' : '')
        + '</div>'
        + '<span class="pill">'+grp.list.length+' 筆</span></div>'
        + (meta ? '<div class="muted" style="padding:6px 2px 2px">'+meta+'</div>' : '')
        + grows + '</div>';
    }
  }

  return '<div class="section">'+filterBar+toggle+body+'</div>';
}

function viewStats(L){
  // 有已實現交易的標的，才放進選單
  var tradedStocks=[];
  for(var m=0;m<STATE.stocks.length;m++){
    var s=STATE.stocks[m];
    if(L[s.id] && L[s.id].realized.length>0) tradedStocks.push(s);
  }

  var allRealized=[];
  for(var id in L){
    for(var i=0;i<L[id].realized.length;i++){
      var r = L[id].realized[i];
      allRealized.push({ stockId:id, sellDate:r.sellDate, buyDate:r.buyDate, shares:r.shares, buyUnit:r.buyUnit, sellUnit:r.sellUnit, profit:r.profit });
    }
  }

  if(allRealized.length===0){
    return '<div class="section"><div class="empty"><div class="g">📈</div>'
      + '<div>還沒有已實現的交易</div>'
      + '<div class="muted" style="margin-top:6px">記錄一筆賣出之後，這裡就會出現走勢圖</div></div></div>';
  }

  // 若目前篩選的標的已無資料，退回「全部」
  if(STATE.statsFilter!=="all"){
    var stillValid=false;
    for(var v=0;v<tradedStocks.length;v++) if(tradedStocks[v].id===STATE.statsFilter) stillValid=true;
    if(!stillValid) STATE.statsFilter="all";
  }

  var opts='<option value="all"'+(STATE.statsFilter==="all"?" selected":"")+'>全部標的</option>';
  for(var o=0;o<tradedStocks.length;o++){
    var ts=tradedStocks[o];
    opts += '<option value="'+ts.id+'"'+(STATE.statsFilter===ts.id?" selected":"")+'>'
      + esc(ts.name)+'（'+esc(ts.code)+'）</option>';
  }
  var picker = '<div class="field" style="margin-bottom:12px"><label>檢視範圍</label>'
    + '<select id="statsPick">'+opts+'</select></div>';

  var filterBar = dateFilterBarHTML("stats", STATE.statsDateFilter, STATE.statsRangeDraftOpen);
  var methodTag = '<div class="muted" style="margin:-4px 0 12px;font-size:11.5px">'
    + '成本算法：<b>'+((STATE.costMethod||"fifo")==="fifo"?"先進先出":"平均成本")+'</b>'
    + '　<span class="addlink" data-act="opensettings" style="font-size:11.5px">切換</span></div>';
  var out = '<div class="section">'+picker+filterBar+methodTag;

  if(STATE.statsFilter==="all"){
    var filteredAll = allRealized.filter(function(r){ return inDateRange(r.sellDate, STATE.statsDateFilter); });

    if(filteredAll.length===0){
      return out + '<div class="empty"><div class="g">📈</div><div>這段期間沒有已實現的交易</div></div></div>';
    }

    var sorted = filteredAll.slice().sort(function(a,b){
      return a.sellDate<b.sellDate?-1:a.sellDate>b.sellDate?1:0; });
    var cum=0, pts=[];
    for(var k=0;k<sorted.length;k++){
      cum += sorted[k].profit;
      pts.push({label:sorted[k].sellDate.slice(5), y:cum});
    }
    var perStock={};
    for(var f=0;f<filteredAll.length;f++){
      var r2=filteredAll[f];
      perStock[r2.stockId] = (perStock[r2.stockId]||0) + r2.profit;
    }
    var items=[];
    for(var n=0;n<STATE.stocks.length;n++){
      var st=STATE.stocks[n];
      if(perStock[st.id] && Math.abs(perStock[st.id])>0.001) items.push({name:st.name, value:perStock[st.id]});
    }
    items.sort(function(a,b){ return b.value-a.value; });

    var periodTitle = STATE.statsDateFilter.type==="all" ? "累積・全部標的" : "累積・全部標的（篩選區間）";
    out += '<div class="chartbox" id="chart_all_cum"><div class="ctitle-row"><div class="ctitle">已實現損益走勢（'+periodTitle+'）</div>'
      + '<span class="dlbtn" data-dlchart="chart_all_cum" data-dlname="累積損益走勢_全部">下載 PNG</span></div>'+lineChartSVG(pts)+'</div>'
      + '<div class="chartbox" id="chart_all_bar"><div class="ctitle-row"><div class="ctitle">各標的已實現損益</div>'
      + '<span class="dlbtn" data-dlchart="chart_all_bar" data-dlname="各標的已實現損益">下載 PNG</span></div>'+barChartSVG(items)+'</div>'
      + periodSummaryHTML(filteredAll);
  }else{
    var lg = L[STATE.statsFilter];
    var stock=null;
    for(var p=0;p<STATE.stocks.length;p++) if(STATE.stocks[p].id===STATE.statsFilter) stock=STATE.stocks[p];

    var allTrades = lg.realized.slice().sort(function(a,b){
      return a.sellDate<b.sellDate?-1:a.sellDate>b.sellDate?1:0; });
    var trades = allTrades.filter(function(r){ return inDateRange(r.sellDate, STATE.statsDateFilter); });

    var periodTotal=0, periodCost=0, wins=0, losses=0;
    for(var r=0;r<trades.length;r++){
      periodTotal += trades[r].profit;
      periodCost += trades[r].cost;
      if(trades[r].profit>=0) wins++; else losses++;
    }
    var periodRoi = periodCost>0 ? periodTotal/periodCost*100 : 0;
    var winRate = trades.length>0 ? (wins/trades.length*100) : 0;

    out += '<div class="card">'
      + '<div class="rb"><div><span class="sname">'+esc(stock?stock.name:"")+'</span>'
      + '<span class="scode">'+esc(stock?stock.code:"")+'</span></div>'
      + '<div style="text-align:right">'
      + '<div class="num '+(periodTotal>=0?"gain":"loss")+'" style="font-weight:700;font-size:17px">'
      + money(periodTotal)+'</div>'
      + '<div class="num '+(periodTotal>=0?"gain":"loss")+'" style="font-size:12.5px;font-weight:700">'+pct(periodRoi)+'</div>'
      + '</div></div>'
      + '<div class="muted" style="margin-top:8px">'
      + '投入成本 '+money(periodCost)+'<br>'
      + trades.length+' 次進出 ・ 賺 '+wins+' 次 ・ 賠 '+losses+' 次 ・ 勝率 '+winRate.toFixed(0)+'%'
      + (lg.holdingShares>0.001 ? ' ・ 目前持有 '+lots(lg.holdingShares) : '')
      + (STATE.statsDateFilter.type!=="all" ? ' ・ <span class="muted">（此為篩選區間內數字，非全部區間）</span>' : '')
      + '</div></div>';

    if(trades.length===0){
      out += '<div class="empty"><div class="g">📈</div><div>這段期間這支標的沒有已實現的交易</div></div>';
    }else{
      var c=0, tpts=[];
      for(var q=0;q<trades.length;q++){
        c += trades[q].profit;
        tpts.push({label:trades[q].sellDate.slice(5), y:c});
      }
      var stockNameSafe = (stock?stock.name:"標的").replace(/[\\/:*?"<>|]/g,"");
      out += '<div class="chartbox" id="chart_one_cum"><div class="ctitle-row"><div class="ctitle">累積已實現損益</div>'
        + '<span class="dlbtn" data-dlchart="chart_one_cum" data-dlname="'+esc(stockNameSafe)+'_累積損益">下載 PNG</span></div>'+lineChartSVG(tpts)+'</div>'
        + '<div class="chartbox" id="chart_one_bar"><div class="ctitle-row"><div class="ctitle">每筆進出損益</div>'
        + '<span class="dlbtn" data-dlchart="chart_one_bar" data-dlname="'+esc(stockNameSafe)+'_每筆損益">下載 PNG</span></div>'+tradeBarSVG(trades)+'</div>'
        + periodSummaryHTML(trades);
    }
  }

  return out + '</div>';
}

var modalEl=null;
function openModal(html){
  closeModal();
  modalEl=document.createElement("div");
  modalEl.className="backdrop";
  modalEl.innerHTML='<div class="modal">'+html+'</div>';
  modalEl.addEventListener("click",function(e){ if(e.target===modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } }

function stockOptionsHTML(selectedId, keyword){
  var kw = (keyword||"").trim().toLowerCase();
  var out="", matched=0;
  for(var i=0;i<STATE.stocks.length;i++){
    var s=STATE.stocks[i];
    var hit = true;
    if(kw){
      var hay = (s.name+" "+(s.code||"")).toLowerCase();
      hit = hay.indexOf(kw)!==-1;
    }
    if(hit) matched++;
    // 保留目前選中的標的，避免搜尋時把選擇弄丟
    if(!hit && s.id!==selectedId) continue;
    out += '<option value="'+s.id+'"'+(s.id===selectedId?" selected":"")+'>'
      + esc(s.name)+(s.code?'（'+esc(s.code)+'）':'')+'</option>';
  }
  if(out==="") out = '<option value="">目前沒有任何標的</option>';
  return { html: out, matched: matched };
}

    + (isLot?"例如 1 或 0.062":"例如 1000 或 62")+'" value="'+curQty+'">'
    + '<div class="helper" id="qtyhint"></div></div>'
    + '<div class="field"><label>成交單價</label>'
    + '<input type="number" step="0.01" inputmode="decimal" id="f_price" placeholder="例如 70.55" value="'+(isEdit?cur.price:"")+'">'
    + '<div class="helper" id="nominal"></div></div>'
    + '<div class="field"><label>含稅金成本價（實際扣款／入帳金額，留空則用名目金額）</label>'
    + '<input type="number" step="1" inputmode="numeric" id="f_cost" placeholder="例如 70650" value="'+(isEdit?cur.costWithTax:"")+'"></div>'
    + '<div class="field"><label>備註（選填）</label>'

    + '<div class="acts"><button class="btn btn-g btn-blk" data-act="close">取消</button>'
    + '<button class="btn btn-p btn-blk" data-act="save">'+(isEdit?"儲存變更":"儲存")+'</button></div>'
  );

  var upd=function(){
    var raw=parseFloat(document.getElementById("f_lots").value)||0;
    var sh = isLot ? Math.round(raw*1000) : Math.round(raw);
    var p=parseFloat(document.getElementById("f_price").value)||0;
    var qh=document.getElementById("qtyhint");
    if(sh>0){
      qh.textContent = isLot ? ("= "+sh.toLocaleString("zh-TW")+" 股")
                             : ("= "+Number((sh/1000).toFixed(3))+" 張");
    }else{ qh.textContent = ""; }
    document.getElementById("nominal").textContent = (sh&&p) ? "名目金額："+money(sh*p) : "";
  };

  document.getElementById("f_stocksearch").addEventListener("input", function(){
    var sel = document.getElementById("f_stock");

    else hint.textContent = "符合 "+res.matched+" 檔";
  });
}

/* ---------- 匯出備份 ---------- */
function exportBackup(){
  var data = JSON.stringify({stocks:STATE.stocks, txns:STATE.txns, exportedAt:new Date().toISOString()}, null, 2);
  var blob = new Blob([data], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href=url; a.download="股票存摺備份_"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("備份檔已下載");
}

/* ---------- 還原備份 ---------- */
function parseBackupText(text){
  var data;
  try{ data = JSON.parse(text); }catch(e){ return { error:"這不是有效的 JSON 檔案，請確認選對了備份檔（.json）。" }; }
  if(!data || typeof data!=="object") return { error:"檔案內容格式不對。" };
  if(!Array.isArray(data.stocks) || !Array.isArray(data.txns)) return { error:"檔案裡缺少「stocks」或「txns」欄位，可能不是這個程式匯出的備份檔。" };
  return { stocks:data.stocks, txns:data.txns, exportedAt:data.exportedAt||null };
}
function restoreBackup(stocks, txns){
  STATE.stocks = stocks;
  STATE.txns = txns;
  commit();
}

/* ---------- Toast ---------- */
var toastTimer=null;
function toast(msg){
  var old=document.querySelector(".toast"); if(old) old.remove();
  var el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.remove(); }, 2200);
}

/* =======================================================================
   事件處理
   ======================================================================= */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-act],[data-del],[data-edit],[data-type],[data-hmode],[data-delstock],[data-dlchart],[data-method],[data-unit]");
  if(!t) return;

  if(t.dataset.tab){
    if(t.dataset.tab==="settings"){ settingsModal(); }
    else { STATE.tab=t.dataset.tab; render(); }
    return;
  }
  if(t.dataset.hmode){
    STATE.historyMode=t.dataset.hmode; render(); return;
  }
  if(t.dataset.unit){
    if(STATE.qtyUnit !== t.dataset.unit){
      STATE.qtyUnit = t.dataset.unit;
      localStorage.setItem(UNIT_KEY, STATE.qtyUnit);
      render();
      settingsModal();
      toast(STATE.qtyUnit==="lot" ? "已改用「張」顯示" : "已改用「股」顯示");
    }
    return;
  }
  if(t.dataset.method){
    if(STATE.costMethod !== t.dataset.method){
      STATE.costMethod = t.dataset.method;
      localStorage.setItem(METHOD_KEY, STATE.costMethod);
      render();
      settingsModal();
      toast(STATE.costMethod==="fifo" ? "已改用先進先出" : "已改用平均成本");
    }
    return;
  }
  if(t.dataset.edit){
    var target=null;
    for(var ei=0;ei<STATE.txns.length;ei++){
      if(STATE.txns[ei].id===t.dataset.edit){ target=STATE.txns[ei]; break; }
    }
    if(target) txnFormModal(target);
    return;
  }
  if(t.dataset.del){
    if(confirm("確定要刪除這筆紀錄嗎？")){
      STATE.txns = STATE.txns.filter(function(x){ return x.id!==t.dataset.del; });
      commit(); toast("已刪除");
    }
    return;
  }
  if(t.dataset.delstock){
    var cnt = parseInt(t.dataset.count,10) || 0;
    var nm = t.dataset.name;
    if(cnt>0){
      if(confirm('「'+nm+'」有 '+cnt+' 筆紀錄，刪除標的會一併刪除這些紀錄，且無法復原。確定要刪除嗎？')){
        deleteStock(t.dataset.delstock, true);
        toast("已刪除「"+nm+"」與其紀錄");
        stockManageModal();
      }
    }else{
      if(confirm('確定要刪除「'+nm+'」嗎？')){
        deleteStock(t.dataset.delstock, false);
        toast("已刪除「"+nm+"」");
        stockManageModal();
      }
    }
    return;
  }
  if(t.dataset.dlchart){
    var fname = (t.dataset.dlname || "圖表") + "_" + today() + ".png";
    downloadChartPNG(t.dataset.dlchart, fname);
    return;
  }
  if(t.dataset.type && modalEl){
    modalEl.dataset.type=t.dataset.type;
    var btns=modalEl.querySelectorAll(".seg button");
    for(var i=0;i<btns.length;i++) btns[i].classList.remove("on");
    t.classList.add("on");
    return;
  }

  var act=t.dataset.act;
  if(act==="add")            addTxnModal();
  else if(act==="close")     closeModal();
  else if(act==="opensettings") settingsModal();
  else if(act==="retrysync") startSync();
  else if(act==="reopenconflict"){
    if(pendingSyncConflict) showSyncConflictModal(STATE.txns.length, pendingSyncConflict.txns.length);
  }
  else if(act==="conflict_usecloud"){
    if(pendingSyncConflict){
      if(pendingSyncConflict.stocks.length) STATE.stocks = pendingSyncConflict.stocks;
      STATE.txns = pendingSyncConflict.txns;
      saveLocal();
      pendingSyncConflict = null;
      STATE.syncStatus = "connected"; STATE.syncError = null;
      closeModal(); render(); toast("已改用雲端資料");
    }
  }
  else if(act==="conflict_uselocal"){
    pendingSyncConflict = null;
    STATE.syncStatus = "connected"; STATE.syncError = null;
    pushCloud();
    closeModal(); render(); toast("已用本機資料覆蓋雲端");
  }
  else if(act==="conflict_cancel"){
    if(fbUnsub){ fbUnsub(); fbUnsub=null; }
    pendingSyncConflict = null;
    STATE.syncCode = ""; STATE.syncStatus = "idle"; STATE.syncError = null;
    localStorage.removeItem(CODE_KEY);
    closeModal(); render(); toast("已取消，資料未變動");
  }
  else if(act==="applyrange"){
    var scope2 = t.dataset.scope;
    var sEl = document.getElementById(scope2+"RangeStart");
    var eEl = document.getElementById(scope2+"RangeEnd");
    var sVal = sEl ? sEl.value : "";
    var eVal = eEl ? eEl.value : "";
    if(!sVal || !eVal){ alert("請選擇起訖日期"); return; }
    if(sVal>eVal){ alert("「起」的日期不能晚於「迄」的日期"); return; }
    STATE[scope2+"DateFilter"] = { type:"range", start:sVal, end:eVal };
    STATE[scope2+"RangeDraftOpen"] = false;
    render();
  }
  else if(act==="clearrange"){
    var scope3 = t.dataset.scope;
    STATE[scope3+"DateFilter"] = { type:"all" };
    STATE[scope3+"RangeDraftOpen"] = false;
    render();
  }
  else if(act==="export")    exportBackup();
  else if(act==="triggerrestore"){
    var inp = document.getElementById("backupFileInput");
    if(inp) inp.click();
  }
  else if(act==="togglenew"){
    var box=document.getElementById("newstock");
    box.style.display = box.style.display==="none" ? "flex" : "none";
  }
  else if(act==="addstock"){
    var n=document.getElementById("f_newname").value.trim();
    var c=document.getElementById("f_newcode").value.trim();
    if(!n){ alert("請輸入標的名稱"); return; }
    var s={id:uid("s"), name:n, code:c};
    STATE.stocks.push(s); saveLocal(); pushCloud();
    var sel=document.getElementById("f_stock");
    var o=document.createElement("option");
    o.value=s.id; o.textContent=s.name+"（"+s.code+"）";
    sel.appendChild(o); sel.value=s.id;
    document.getElementById("newstock").style.display="none";
    document.getElementById("f_newname").value="";
    document.getElementById("f_newcode").value="";
    toast("已新增標的");
  }
  else if(act==="save"){
    var stockId=document.getElementById("f_stock").value;
    var date=document.getElementById("f_date").value;
    var lotsRaw=document.getElementById("f_lots").value;
    var priceRaw=document.getElementById("f_price").value;
    var costV=document.getElementById("f_cost").value;
    var noteEl=document.getElementById("f_note");
    var noteV=noteEl ? noteEl.value.trim() : "";

    var errMsg = validateTxnFields({stockId:stockId, date:date, lots:lotsRaw, price:priceRaw, cost:costV});
    if(errMsg){ alert(errMsg); return; }

    var shares = (STATE.qtyUnit||"share")==="lot"
      ? Math.round(parseFloat(lotsRaw)*1000)
      : Math.round(parseFloat(lotsRaw));
    var price=parseFloat(priceRaw);
    var nominal=shares*price;
    var finalCost = costV!=="" ? parseFloat(costV) : nominal;
    var editId = modalEl.dataset.editid;

    if(editId){
      for(var ti=0; ti<STATE.txns.length; ti++){
        if(STATE.txns[ti].id===editId){
          STATE.txns[ti].stockId = stockId;
          STATE.txns[ti].type = modalEl.dataset.type||"buy";
          STATE.txns[ti].date = date;
          STATE.txns[ti].shares = shares;
          STATE.txns[ti].price = price;
          STATE.txns[ti].costWithTax = finalCost;
          STATE.txns[ti].note = noteV;
          break;
        }
      }
      closeModal(); commit(); toast("已更新這筆紀錄");
    }else{
      STATE.txns.push({
        id:uid("t"), stockId:stockId, type:modalEl.dataset.type||"buy",
        date:date, shares:shares, price:price,
        costWithTax: finalCost, note: noteV,
        createdAt:Date.now()
      });
      closeModal(); commit(); toast("已新增一筆紀錄");
    }
  }
  else if(act==="newroom"){
    var code=(uid("room").replace(/[^a-z0-9]/gi,"")+Math.random().toString(36).slice(2)).slice(0,24);
    STATE.syncCode=code;
    localStorage.setItem(CODE_KEY, code);
    closeModal(); startSync(); toast("同步代碼已建立");
  }
  else if(act==="joinroom"){
    var v=document.getElementById("f_code").value.trim();
    if(!v){ alert("請輸入同步代碼"); return; }
    STATE.syncCode=v;
    localStorage.setItem(CODE_KEY, v);
    closeModal(); startSync();
  }
  else if(act==="leaveroom"){
    if(confirm("確定要中斷這台裝置的同步嗎？（雲端資料不會被刪除）")){
      if(fbUnsub){ fbUnsub(); fbUnsub=null; }
      STATE.syncCode=""; STATE.syncStatus="idle";
      localStorage.removeItem(CODE_KEY);
      closeModal(); render();
    }
  }
  else if(act==="openfbsetup") firebaseSetupModal();
  else if(act==="parsefb"){
    var raw = document.getElementById("f_fbraw").value;
    var res = parseFirebaseConfigText(raw);
    var box = document.getElementById("fbparse_result");
    if(res.missing.length>0){
      box.innerHTML = '<div class="warn">貼上的內容裡找不到：<b>'+res.missing.join("、")+'</b>，請確認完整複製了 Firebase 的設定程式碼（包含所有欄位）。</div>';
      return;
    }
    box.innerHTML = '<div class="warn" style="background:#E7F3ED;color:var(--loss)">✓ 解析成功，專案：'+esc(res.config.projectId)+'</div>';
    saveFirebaseConfig(res.config);
    toast("雲端設定已儲存");
    setTimeout(function(){ closeModal(); settingsModal(); }, 500);
  }
  else if(act==="clearfbconfig"){
    if(confirm("確定要清除目前的雲端設定嗎？這台裝置會回到本機模式，雲端上的資料不會被刪除。")){
      clearFirebaseConfig();
      closeModal(); toast("已清除雲端設定"); render();
    }
  }
  else if(act==="openstockmanage") stockManageModal();
  else if(act==="clearunused"){
    var removed = clearUnusedStocks();
    toast(removed>0 ? "已清除 "+removed+" 檔沒有紀錄的標的" : "沒有可清除的標的");
    stockManageModal();
  }
  else if(act==="nukeall"){
    var input = prompt('此動作會刪除「所有」交易紀錄，且無法復原（標的清單會保留）。\n請輸入「刪除」兩個字以確認：');
    if(input==="刪除"){
      clearAllRecords();
      closeModal(); toast("已清除所有交易紀錄");
    }else if(input!==null){
      toast("輸入不符，已取消");
    }
  }
  else if(act==="cyclemetric"){
    var ms = computeHomeMetrics(allLedgers());
    var cur = 0;
    for(var ci=0; ci<ms.length; ci++){ if(ms[ci].key===STATE.homeMetric) cur = ci; }
    var next = ms[(cur+1) % ms.length];
    STATE.homeMetric = next.key;
    localStorage.setItem(METRIC_KEY, STATE.homeMetric);
    render();
  }
  else if(act==="opentutorial") tutorialModal();
  else if(act==="openimport") importModal();
  else if(act==="parseimport"){
    var txt = document.getElementById("f_importtext").value;
    var parsed = parseImportText(txt);
    var box = document.getElementById("import_preview");
    var dupTotal = parsed.dupExisting.length + parsed.dupInFile.length;
    var dupBox = "";
    if(dupTotal>0){
      dupBox = '<div class="warn">已自動跳過 '+dupTotal+' 筆重複資料：'
        + (parsed.dupExisting.length ? '<br>• 其中 '+parsed.dupExisting.length+' 筆已經在紀錄裡（避免重複匯入造成損益翻倍）' : '')
        + (parsed.dupInFile.length ? '<br>• 其中 '+parsed.dupInFile.length+' 筆是這次貼上的內容裡自己重複的' : '')
        + '<div style="margin-top:6px;font-size:11.5px">'
        + parsed.dupExisting.concat(parsed.dupInFile).slice(0,5).map(esc).join('<br>')
        + (dupTotal>5?'<br>…':'') + '</div></div>';
    }

    if(parsed.rows.length===0){
      box.innerHTML = dupBox
        + '<div class="warn">沒有新的資料可以匯入。'+(parsed.errors.length?'<br>'+parsed.errors.slice(0,6).map(esc).join('<br>'):'')+'</div>';
      return;
    }
    var summary = '<div class="warn" style="background:#E7F3ED;color:var(--loss)">'
      + '✓ 可匯入 '+parsed.rows.length+' 筆交易'
      + (parsed.newStockNames.length ? '，將新增 '+parsed.newStockNames.length+' 檔標的：'+esc(parsed.newStockNames.join('、')) : '')
      + '</div>';
    var errBox = parsed.errors.length
      ? '<div class="warn">'+parsed.errors.length+' 行無法解析，已略過：<br>'+parsed.errors.slice(0,6).map(esc).join('<br>')+(parsed.errors.length>6?'<br>…':'')+'</div>'
      : '';
    box.innerHTML = summary + dupBox + errBox
      + '<button class="btn btn-p btn-blk" style="margin-top:10px" data-act="confirmimport">確認匯入 '+parsed.rows.length+' 筆</button>';
    box.dataset.rows = JSON.stringify(parsed.rows);
    box.dataset.newstocks = JSON.stringify(parsed.newStockNames);
  }
  else if(act==="confirmimport"){
    var box = document.getElementById("import_preview");
    var rows = JSON.parse(box.dataset.rows||"[]");
    var newStocks = JSON.parse(box.dataset.newstocks||"[]");
    commitImport(rows, newStocks);
    closeModal();
    toast("已匯入 "+rows.length+" 筆交易");
  }
});

document.addEventListener("change", function(e){
  if(e.target && e.target.id==="statsPick"){
    STATE.statsFilter = e.target.value;
    render();
  }
  if(e.target && e.target.id==="homeMetricSelect"){
    STATE.homeMetric = e.target.value;
    localStorage.setItem(METRIC_KEY, STATE.homeMetric);
    render();
  }
  if(e.target && (e.target.id==="historyRangeSelect" || e.target.id==="statsRangeSelect")){
    var scope = e.target.dataset.scope; // "hist" | "stats"
    var val = e.target.value;
    var filterKey = scope+"DateFilter";
    var draftKey = scope+"RangeDraftOpen";
    if(val==="all"){
      STATE[filterKey] = { type:"all" };
      STATE[draftKey] = false;
    }else if(val==="custom"){
      STATE[draftKey] = true;
    }else{
      STATE[filterKey] = { type:"month", month: val };
      STATE[draftKey] = false;
    }
    render();
  }
  if(e.target && e.target.id==="backupFileInput"){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      var result = parseBackupText(evt.target.result);
      if(result.error){ alert(result.error); return; }
      var msg = "即將還原備份檔"
        + (result.exportedAt ? "（匯出於 "+String(result.exportedAt).slice(0,10)+"）" : "")
        + "，內含 "+result.stocks.length+" 檔標的、"+result.txns.length+" 筆交易。\n\n"
        + "這會覆蓋掉這台裝置目前所有的資料（"+STATE.stocks.length+" 檔標的、"+STATE.txns.length+" 筆交易），且無法復原。確定要還原嗎？";
      if(confirm(msg)){
        restoreBackup(result.stocks, result.txns);
        closeModal();
        toast("已還原備份檔");
      }
    };
    reader.onerror = function(){ alert("讀取檔案失敗，請再試一次。"); };
    reader.readAsText(file);
    e.target.value = "";
  }
});

    '<div style="margin:40px 20px;padding:20px;background:#fff;border:1px solid #DCD3BC;border-radius:14px">'
    + '<div style="font-weight:700;margin-bottom:10px">⚠ 程式啟動時發生錯誤</div>'
    + '<div style="font-size:13px;color:#5B6B60;line-height:1.7">錯誤訊息：'+esc(err && err.message ? err.message : String(err))
    + '<br><br>請把這段訊息截圖回報，就能查出問題所在。</div></div>';
}
</script>
